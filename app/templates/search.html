<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Questions - Quiz Learning App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <button title="Focus mode" onclick="focusMode()"></button>
        <h1>Search Questions</h1>
        <button title="Back to projects" onclick="window.location.href='/'">←</button>
    </header>
    <footer>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search questions and answers..." autofocus>
            <button id="answerCount">0</button>
            <button onClick="toggleSpecificSearch(event)" data-tooltip="Toggle specific search">⬜</button>
            <button onClick="toggleCaseStudyExclusion(event)" data-tooltip="Exclude case studies">❕</button>
            <button onClick="clearSearch()" data-tooltip="Clear search">❌</button>
        </div>
    </footer>
    <main>
        <section>
            <div id="searchResults" class="search-results">
                <div class="search-info">
                    Type at least 3 characters to start searching
                </div>
            </div>
        </section>
    </main>

    <script>const PROJECT_ID = {{ project.id if project else 'null' }};</script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
    <script src="{{ url_for('static', filename='search.js') }}"></script>
</body>
</html>
