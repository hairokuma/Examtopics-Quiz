<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Questions - Quiz Learning App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* footer search bar */
    .search-bar {
      font-size: 16px;
      border: 2px solid #333;
      color: #fff;
      display: flex;
      flex: 1;
      padding: 0 .5rem;
      gap: .5rem;
      height: 36px;
    }

    .search-bar input {
      flex-grow: 1;
      background: #000;
      font-size: 16px;
      color: #fff;
      border: none;
      line-height: 2rem;
    }

    .search-bar input:focus {
      outline: none;
    }

    .search-bar button {
      background: #000;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      width: 32px;
      position: relative;
      line-height: 15px;
    }
    
    .search-bar button:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      font-size: 12px;
      margin-bottom: 5px;
      pointer-events: none;
      z-index: 1000;
    }
    
    .search-bar button:hover::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #333;
      margin-bottom: -5px;
      pointer-events: none;
      z-index: 1000;
    }

    /* search result */
    .search-results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-result-item {
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      gap: 8px;
    }

    .search-result-item>* {
      padding: 12px;
    }

    /* header */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-meta {
      color: #888;
      font-size: 14px;
    }

    .result-project {
      color: #fff;
      font-weight: bold;
      background: #333;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }

    /* content */
    .result-correct-answers {
      background: #0a3d0a;
      border-left: 3px solid #00ff00;
      padding: 12px;
    }


    .search-info,
    .no-results {
      text-align: center;
      color: #888;
      padding: 40px 20px;
      font-size: 14px;
    }

    .result-link:hover {
      background: #fff;
      color: #000;
    }

    .embedded-image img {
      max-width: 100%;
      height: auto;
      border: 1px solid #333;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <footer>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search questions and answers..." autofocus>
      <button id="answerCount">0</button>
      
      <button onClick="toggleSpecificSearch()" data-tooltip="Toggle specific search">⬜</button>
      <button onClick="toggleCaseStudyExclusion()" data-tooltip="Exclude case studies">❕</button>
      <button onClick="clearSearch()" data-tooltip="Clear search">❌</button>
    </div>
  </footer>
  <main>
    <div id="searchResults" class="search-results">
      <div class="search-info">
        Type at least 3 characters to start searching
      </div>
    </div>
  </main>
  

  <script>
    const PROJECT_ID = {{ project.id if project else 'null' }};
    let searchTimeout;
    let specificSearch = false;
    let excludeCaseStudy = false;
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();

      if (query.length < 3) {
        searchResults.innerHTML = '<div class="search-info">Type at least 3 characters to start searching</div>';
        return;
      }

      searchTimeout = setTimeout(() => {
        performSearch(query);
      }, 300);
    });

    function toggleSpecificSearch() {
      specificSearch = !specificSearch;
      event.target.textContent = specificSearch ? '✅' : '⬜';
      const query = searchInput.value.trim();
      if (query.length >= 3) {
        performSearch(query);
      }
    }

    function toggleCaseStudyExclusion() {
      excludeCaseStudy = !excludeCaseStudy;
      event.target.textContent = excludeCaseStudy ? '❗' : '❕';
      const query = searchInput.value.trim();
      if (query.length >= 3) {
        performSearch(query);
      }
    }

    function clearSearch() {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
      searchInput.focus();
    }

    async function performSearch(query) {
      try {
        searchResults.innerHTML = '<div class="search-info">Searching...</div>';

        // If specific search is checked and query is not already in quotes, wrap it
        let searchQuery = query;
        if (specificSearch && !query.startsWith('"') && !query.startsWith("'")) {
          searchQuery = `"${query}"`;
        }

        const excludeParam = excludeCaseStudy ? '&exclude_case_study=true' : '';
        const response = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}${PROJECT_ID ? '&project_id=' + PROJECT_ID : ''}${excludeParam}`);
        const results = await response.json();

        if (results.length === 0) {
          searchResults.innerHTML = '<div class="no-results">No results found</div>';
          return;
        }

        displayResults(results, searchQuery);
      } catch (error) {
        console.error('Search error:', error);
        searchResults.innerHTML = '<div class="no-results">Error performing search</div>';
      }
    }

    function highlightText(text, query) {
      if (!text || !query) return text;

      // Split text into parts: HTML tags and text content
      const parts = text.split(/(<[^>]+>)/g);
      
      // Check if query is in quotes - if so, highlight exact phrase
      if ((query.startsWith('"') && query.endsWith('"')) || (query.startsWith("'") && query.endsWith("'"))) {
        const searchPhrase = query.slice(1, -1).trim();
        if (searchPhrase.length < 2) return text;
        const regex = new RegExp(`(${escapeRegex(searchPhrase)})`, 'gi');
        
        // Only highlight in non-tag parts
        return parts.map(part => {
          if (part.startsWith('<') && part.endsWith('>')) {
            return part; // Don't highlight inside HTML tags
          }
          return part.replace(regex, '<mark>$1</mark>');
        }).join('');
      } else {
        // Split query into words and highlight each word separately
        const words = query.split(/\s+/).filter(word => word.length >= 2);
        let result = parts;
        
        words.forEach(word => {
          const regex = new RegExp(`(${escapeRegex(word)})`, 'gi');
          result = result.map(part => {
            if (part.startsWith('<') && part.endsWith('>')) {
              return part; // Don't highlight inside HTML tags
            }
            return part.replace(regex, '<mark>$1</mark>');
          });
        });
        
        return result.join('');
      }
    }

    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Process text to detect and convert image URLs to img tags
    function processTextWithImages(text) {
      if (!text) return '';

      // Regex patterns to detect various image URL formats
      const imageUrlPattern = /(https?:\/\/[^\s<>"]+?\.(jpg|jpeg|png|gif|bmp|webp|svg)(\?[^\s<>"]*)?)/gi;
      const markdownImagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;

      // First, handle markdown image syntax ![alt](url)
      text = text.replace(markdownImagePattern, (match, alt, url) => {
        return `<div class="embedded-image"><img src="${url}" alt="${alt}" /></div>`;
      });

      // Then handle plain URLs
      text = text.replace(imageUrlPattern, (match) => {
        return `<div class="embedded-image"><img src="${match}" alt="Question image" /></div>`;
      });

      return text;
    }

    function displayResults(results, query) {
      let html = '';

      results.forEach(result => {
        // Process images first, then highlight text
        const processedQuestion = processTextWithImages(result.question_text);
        const highlightedQuestion = highlightText(processedQuestion, query);

        // Process images in answers, then highlight
        const highlightedCorrectAnswers = result.correct_answers_text.map(answer => {
          const processedAnswer = processTextWithImages(answer);
          return highlightText(processedAnswer, query);
        });
        const highlightedAnswers = result.answers_text.map(answer => {
          const processedAnswer = processTextWithImages(answer);
          return highlightText(processedAnswer, query);
        });

        html += `
        <div class="search-result-item">
          <div class="result-header">
              <div class="result-meta">
                  <span class="result-project">${result.project_name}</span>
                  Topic ${result.topic_id} - Question ${result.question_id}
              </div>
              <a href="/quiz/${result.project_id}/question/${result.id}" class="btn btn-primary">
                  Go to Question →
              </a>
          </div>
          <div class="result-correct-answers">
            ${highlightedCorrectAnswers.map(answer =>
          `<div class="result-answer">${answer}</div>`
        ).join('')}
          </div>
          <div class="result-question">
              ${highlightedQuestion}
              <hr>
              ${highlightedAnswers.map(answer =>
          `<div class="result-answer">${answer}</div>`
        ).join('')}
              
        </div>
      </div>`;
      });

      searchResults.innerHTML = html;
      document.getElementById('answerCount').textContent = results.length;

    }
  </script>
</body>

</html>
