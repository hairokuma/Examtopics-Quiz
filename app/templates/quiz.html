<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} - Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <button id="toggleSidebar" title="Toggle question list">☰</button>
        <h1>{{ project.name }}</h1>
        <div class="stats">
            <div class="item">
                Progress:<mark id="progressStat">0/0</mark>
            </div>
            <div class="item">
                Correct:<mark id="correctStat">0</mark>
            </div>
            <div class="item">
                Marked:<mark id="markedStat">0</mark>
            </div>
        </div>
        <button title="Back to projects" onclick="window.location.href='/'">←</button>
    </header>

    <main>
        <nav id="questionList">
            <h3>Questions</h3>
            <div class="nav-buttons">
                <button class="active" data-filter="all" onclick="setNavFilter('all')">All</button>
                <button data-filter="incorrect" onclick="setNavFilter('incorrect')">Incorrect</button>
                <button data-filter="marked" onclick="setNavFilter('marked')">Marked</button>
            </div>
            <div id="questionNav"></div>
        </nav>

        <section class="question-content" id="questionContent">
            <div class="loading">Loading questions...</div>
        </section>
    </main>

    <footer id="quiz-footer">
    </footer>

    <script>const projectId = {{ project.id }};</script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
    <script src="{{ url_for('static', filename='quiz.js') }}"></script>
</body>
</html>
