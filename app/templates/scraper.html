<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper - Quiz Learning App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scraper.css') }}">
</head>
<body>
    <header>
        <h1>Scraper</h1>
        <a href="/" class="header-back-link">← Projects</a>
    </header>

    <div class="content-wrapper">
        <!-- Publisher Sidebar -->
        <nav id="publisherPanel">
            <div class="panel-header">
                Publishers
                <div class="panel-header-actions">
                    <button class="btn-sm" onclick="toggleAddPublisher()" title="Add publisher">+</button>
                    <button class="btn-sm" onclick="loadPublishers()" title="Reload">↻</button>
                </div>
            </div>
            <div id="addPublisherForm" style="display:none;">
                <input type="text" id="publisherUrlInput"
                       style="width:100%;background:#000;border:1px solid #444;color:#fff;padding:5px 7px;font-size:12px;font-family:inherit;"
                       placeholder="URL or name (e.g. sap)"
                       onkeydown="if(event.key==='Enter')addPublisher()">
                <div class="add-form-actions">
                    <button class="btn-sm primary" onclick="addPublisher()">Add</button>
                    <button class="btn-sm" onclick="toggleAddPublisher()">✕</button>
                </div>
            </div>
            <div id="publisherItems"><div class="placeholder">Loading...</div></div>
        </nav>

        <!-- Main Exam Panel -->
        <main id="examPanel">
            <div id="examContent">
                <div class="placeholder">Select a publisher to see available exams</div>
            </div>
        </main>
    </div>

    <!-- Progress Footer -->
    <footer id="progressBar">
        <div class="progress-top">
            <span class="progress-label" id="progressLabel">Running...</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-pct" id="progressPct">0 / 0</span>
            <span id="logToggle" onclick="toggleLog()">show log</span>
        </div>
        <div id="logBox"></div>
    </footer>

    <!-- Create Project Modal -->
    <div class="modal" id="createModal">
        <div class="modal-box">
            <h3>Create Project — <span id="modalExamName"></span></h3>
            <div class="form-row">
                <label>ExamTopics Link</label>
                <div class="link-row">
                    <input type="url" id="projectLink" placeholder="https://examtopics.com/exams/...">
                    <button class="btn-sm primary" onclick="fetchProjectInfo()" id="fetchInfoBtn">Fetch</button>
                </div>
            </div>
            <div class="form-row">
                <label>Project Name</label>
                <input type="text" id="projectName" placeholder="Microsoft AZ-104 Azure Administrator">
            </div>
            <div class="form-row">
                <label>Description</label>
                <textarea id="projectDescription" placeholder="Short description..."></textarea>
            </div>
            <div class="form-row-group">
                <div class="form-row">
                    <label>Question Count</label>
                    <input type="number" id="projectQuestions" placeholder="0">
                </div>
                <div class="form-row">
                    <label>Last Updated</label>
                    <input type="text" id="projectLastUpdated" placeholder="Jan. 5, 2026">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-sm" onclick="closeModal()">Cancel</button>
                <button class="btn-sm primary" onclick="submitCreateProject()">Create Project</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='utils.js') }}"></script>
    <script src="{{ url_for('static', filename='scraper.js') }}"></script>
</body>
</html>
